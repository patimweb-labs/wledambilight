[package]
name = "wled-ambilight-fenster"
# Fest: die Programmversion steht im Wurzelpaket (release-please hebt nur
# dort an); dieses Crate wird nicht einzeln veröffentlicht.
version = "0.7.1"
edition = "2021"
rust-version = "1.90"
description = "WLED Ambilight: das Fenster in egui, direkt auf dem laufenden Kern"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "wled_ambilight_fenster"
path = "src/lib.rs"

[dependencies]
wled_ambilight = { package = "wled-ambilight-core", path = "../core" }
# egui wie in crosspoint (ADR 0001): Renderer glow, AccessKit an, Wayland und
# X11 werden zur Laufzeit geladen – keine -devel-Pakete beim Bauen.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit", "wayland", "x11"] }
egui = { version = "0.37", default-features = false }
# Icons und Zeichen: SVG (Lucide in `icons/`, das Logo aus `assets/`), mit resvg
# gezeichnet und mit der Theme-Farbe eingefärbt – scharf in jeder Größe.
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
# Das Fenster aus der Aufnahme nehmen (Windows): Griff aus eframe.
raw-window-handle = "0.6"

# Tray unter Linux: StatusNotifierItem über D-Bus, reines Rust, kein GTK.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

# Tray unter Windows (Infobereich) und macOS (Menüleiste).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.25"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }

[build-dependencies]
serde_json = "1"
