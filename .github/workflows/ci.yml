name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Die Oberfläche ist eine Web-Anwendung. Sie muss vor dem Rust-Build fertig sein,
  # weil Tauri die Dateien in das Programm einbettet.
  WPM_UI_DIR: ${{ github.workspace }}/weppelmann-ui

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Die geteilte Komponentenbibliothek liegt in einem eigenen, privaten
      # Repository. Ohne diesen Schritt fehlen Tokens und Komponenten. Der
      # Workflow braucht dafür das Secret WPM_UI_TOKEN (Repo-Lese-Recht).
      - name: Oberflächen-Bibliothek
        uses: actions/checkout@v7
        with:
          repository: Smotherer007/weppelmann-ui
          path: weppelmann-ui
          token: ${{ secrets.WPM_UI_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Systembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - name: Tokens bauen
        working-directory: weppelmann-ui
        run: |
          npm install --no-audit --no-fund
          npm run -w @weppelmann/tokens build
      - name: Oberfläche bauen
        run: |
          npm install --no-audit --no-fund
          npm --prefix ui run build
      # Warnungen erscheinen als Hinweis, sie brechen den Bau nicht: jede neue
      # Rust-Version bringt neue Lints. Echte Fehler (correctness) brechen ab.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D clippy::correctness
      - name: Tests
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked

  metadata:
    name: Linux metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate desktop file and AppStream metadata
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils appstream
          desktop-file-validate packaging/linux/*.desktop
          appstreamcli validate --no-net packaging/linux/*.metainfo.xml
