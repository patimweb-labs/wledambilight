name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Das Fenster ist egui: Wayland, X11 und OpenGL werden zur Laufzeit
      # geladen, zum Bauen braucht es keine -devel-Pakete. Der Tray unter
      # Linux ist ksni (D-Bus in reinem Rust), ohne GTK.
      # Warnungen erscheinen als Hinweis, sie brechen den Bau nicht: jede neue
      # Rust-Version bringt neue Lints. Echte Fehler (correctness) brechen ab.
      - name: Clippy
        run: cargo clippy --all-targets --locked --workspace -- -D clippy::correctness
      # Die Oberflächentests (egui_kittest) bedienen das Fenster über
      # AccessKit, ohne Bildschirm und ohne GPU.
      - name: Tests
        run: cargo test --locked --workspace
      - name: Build
        run: cargo build --release --locked

  metadata:
    name: Linux metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate desktop file and AppStream metadata
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils appstream
          desktop-file-validate packaging/linux/*.desktop
          appstreamcli validate --no-net packaging/linux/*.metainfo.xml

  versions:
    name: Versionen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Alle Stellen, die eine Release-Pull-Request setzt, müssen zusammenpassen.
      # Wer von Hand nur `Cargo.toml` anhebt (und taggt), lässt das Manifest auf
      # der alten Version stehen; release-please rechnet die Version dann noch
      # einmal aus und scheitert am Ende mit "Duplicate release tag".
      - name: Versionen stimmen überein
        run: |
          set -euo pipefail
          package=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          lock=$(sed -n '/^name = "wled-ambilight"$/,/^version/p' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)
          manifest=$(jq -r '.["."]' .release-please-manifest.json)
          metainfo=$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' packaging/linux/*.metainfo.xml | head -1)
          status=0
          for pair in "Cargo.toml:$package" "Cargo.lock:$lock" "Manifest:$manifest" "metainfo:$metainfo"; do
            printf '%-20s %s\n' "${pair%%:*}" "${pair#*:}"
            [ "${pair#*:}" = "$package" ] || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::Versionen weichen von Cargo.toml ($package) ab — release-please rechnet sonst dieselbe Version erneut aus."
            exit 1
          fi
