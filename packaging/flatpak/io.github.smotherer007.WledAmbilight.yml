# Flatpak-Manifest für WLED Ambilight (Tauri-Oberfläche).
#
# Lokal bauen (aus dem Projektwurzel):
#   bash packaging/flatpak/update-cargo-sources.sh
#   flatpak-builder --user --install --force-clean build-flatpak \
#       packaging/flatpak/io.github.smotherer007.WledAmbilight.yml
#
# Bauart: Rust und Node bauen im Sandkasten. Die Oberfläche ist eine
# Vue-Anwendung; sie wird vor dem Rust-Build erzeugt (`ui/dist`), weil Tauri die
# Dateien einbettet.
#
# ACHTUNG, ungeprüft: Die Komponentenbibliothek liegt in einem eigenen Repository
# (weppelmann-ui). Der Bau erwartet sie als Ordner `weppelmann-ui` neben diesem
# Projekt (Quelle unten) oder als npm-Paket aus einem privaten Registry. Für
# Flathub muss die Quelle auf einen Git-Tag zeigen statt auf einen lokalen Pfad.
id: io.github.smotherer007.WledAmbilight
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: wled-ambilight

finish-args:
  # Fenster (Wayland zuerst, X11 als Rückfall), GPU für die Darstellung.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # UDP/HTTP zu den Geräten, mDNS-Suche.
  - --share=network
  # Taskleisten-Symbol.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Bildschirmaufnahme läuft über das ScreenCast-Portal (kein Zusatzrecht).
  - --talk-name=org.freedesktop.portal.Desktop

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/wled-ambilight/cargo
    CARGO_NET_OFFLINE: 'true'
    WPM_UI_DIR: /run/build/weppelmann-ui

modules:
  # Die Oberflaeche wird VOR dem Flatpak-Bau auf dem Host erzeugt:
  #   cd ui && npm ci && npm run build
  # Grund: npm im Build-Sandkasten (10.9.9 der node22-Extension) bricht bei
  # diesem Workspace mit "Exit handler never called!" ab. Fuer Flathub muss
  # das spaeter auf einen npm-Aufruf im Sandkasten zurueck (oder auf eine
  # feste Node-Version), hier zaehlt ein reproduzierbarer lokaler Bau.
  - name: wled-ambilight
    buildsystem: simple
    build-options:
      env:
        HOME: /tmp
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked --verbose
      - install -Dm755 target/release/wled-ambilight ${FLATPAK_DEST}/bin/wled-ambilight
      - install -Dm644 packaging/linux/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 packaging/linux/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 assets/icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - for s in 16 24 32 48 64 128 256 512; do install -Dm644 assets/icons/icon-$s.png ${FLATPAK_DEST}/share/icons/hicolor/${s}x${s}/apps/${FLATPAK_ID}.png; done
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - build-flatpak
          - build-dir
          - .flatpak-builder
          - ui/node_modules
      - cargo-sources.json
