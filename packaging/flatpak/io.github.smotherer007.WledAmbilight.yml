# Flatpak-Manifest für WLED Ambilight (Oberfläche in egui, reines Rust).
#
# Lokal bauen (aus dem Projektwurzel):
#   bash packaging/flatpak/update-cargo-sources.sh
#   flatpak-builder --user --install --force-clean build-flatpak \
#       packaging/flatpak/io.github.smotherer007.WledAmbilight.yml
#
# Für Flathub die `dir`-Quelle unten durch den Git-Tag eines Releases ersetzen
# (siehe packaging/flatpak/README.md). Kein Node, kein WebKit und keine
# AppIndicator-Bibliothek mehr: das Fenster ist egui, der Tray ksni (D-Bus).
id: io.github.smotherer007.WledAmbilight
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: wled-ambilight

finish-args:
  # Fenster (Wayland zuerst, X11 als Rückfall), GPU für die Darstellung.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # UDP/HTTP zu den Geräten, mDNS-Suche.
  - --share=network
  # Taskleisten-Symbol (StatusNotifierItem).
  - --talk-name=org.kde.StatusNotifierWatcher
  # Bildschirmaufnahme über das ScreenCast-Portal, GStreamer aus der Runtime.
  - --talk-name=org.freedesktop.portal.Desktop

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/wled-ambilight/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: wled-ambilight
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked --verbose
      - install -Dm755 target/release/wled-ambilight ${FLATPAK_DEST}/bin/wled-ambilight
      - install -Dm644 packaging/linux/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 packaging/linux/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 assets/icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 assets/wled-ambilight-symbolic.svg ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/${FLATPAK_ID}-symbolic.svg
      - for s in 16 24 32 48 64 128 256 512; do install -Dm644 assets/icons/icon-$s.png ${FLATPAK_DEST}/share/icons/hicolor/${s}x${s}/apps/${FLATPAK_ID}.png; done
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - build-flatpak
          - build-dir
          - .flatpak-builder
      - cargo-sources.json
